corpo: "Não sei ainda quem é Viscusbear nem onde ele se conecta com Vixtor. Não sei se sou persona, se sou apenas uma ideia que pode ser largada ou deixada de lado como várias outras. Só sei que estou atrás de descobrir. Por enquanto, é só isso."
assinatura: "ASS. VIXTOR"

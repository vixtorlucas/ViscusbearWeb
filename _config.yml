title: Viscusbear
description: O site pessoal de Vixtor.
url: "https://viscusbear.com.br"
baseurl: ""
lang: pt-BR
timezone: America/Fortaleza
permalink: pretty
exclude:
  - ferramentas
  - PROJECT_CONTEXT.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - testar.ps1
  - _to_delete
  - CLAUDE.md
  - _rodar-local.bat
include:
  - _headers

# Entradas (texto e foto num lugar só). Cada arquivo em _posts/ vira uma
# entrada em /entradas/<slug>/; as tags viram comunidades em /comunidades/.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: entrada
      permalink: /entradas/:title/

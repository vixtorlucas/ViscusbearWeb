# INATIVO desde a migração para o Cloudflare Pages (31/08/2026).
# Quem constrói e publica o site agora é o Cloudflare Pages, direto do repositório.
# Este workflow ficou só como caminho de volta para o GitHub Pages: ele não roda
# sozinho, apenas quando disparado à mão em Actions -> Run workflow.
# Se você não pretende voltar, pode apagar este arquivo.

name: Build e deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

